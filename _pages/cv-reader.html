<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rusi Wang - CV</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-rw-32x32.png' | relative_url }}?v=RW20260827">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon-rw-16x16.png' | relative_url }}?v=RW20260827">
  <link rel="shortcut icon" href="{{ '/images/favicon-rw.ico' | relative_url }}?v=RW20260827">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font: 13px/1.3 Arial, sans-serif; color: #f4f4f4; background: #525659; }
    button, input { font: inherit; }
    button, .toolbar a { color: inherit; background: none; border: 0; cursor: pointer; }
    button:hover, .toolbar a:hover { background: #505154; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #8ac5e4; outline-offset: -2px; }
    .toolbar { height: 48px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: #323639; box-shadow: 0 1px 3px #2229; }
    .toolbar button, .toolbar a { width: 30px; min-width: 30px; height: 30px; padding: 0; display: inline-flex; justify-content: center; align-items: center; border-radius: 3px; text-decoration: none; }
    .toolbar button svg, .toolbar a svg { display: block; width: 18px; height: 18px; flex: none; }
    .toolbar .title { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-left: 4px; }
    .toolbar .separator { width: 1px; height: 20px; margin: 0 4px; background: #707174; }
    #pageNumber { width: 35px; height: 25px; text-align: center; color: white; background: #242629; border: 1px solid #555; }
    .zoom-control { display: inline-flex; align-items: center; justify-content: center; min-width: 50px; height: 25px; white-space: nowrap; }
    #zoomInput { width: 23px; padding: 0; color: white; background: transparent; border: 0; text-align: right; font-size: 12px; appearance: textfield; -moz-appearance: textfield; }
    #zoomInput::-webkit-inner-spin-button, #zoomInput::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .zoom-control span { font-size: 12px; }
    .workspace { height: calc(100% - 48px); display: flex; }
    .thumbnails { width: 155px; flex: none; overflow-y: auto; background: #292b2e; padding: 16px 0; text-align: center; }
    .thumbnails[hidden] { display: none; }
    .thumb { display: block; width: 120px; margin: 0 auto 16px; padding: 4px 4px 6px; color: white; border: 2px solid transparent; background: transparent; font-size: 12px; }
    .thumb.active { border-color: #8ab9ed; }
    .thumb canvas { display: block; max-width: 100%; margin: 0 auto 5px; box-shadow: 0 1px 5px #111; }
    .scroller { flex: 1; min-width: 0; overflow: auto; scrollbar-gutter: stable; padding: 16px; }
    .sheet { position: relative; width: max-content; max-width: none; margin: 0 auto 16px; background: white; box-shadow: 0 2px 8px #2227; }
    .sheet canvas { display: block; }
    .textLayer { position: absolute; inset: 0; overflow: clip; line-height: 1; letter-spacing: normal; word-spacing: normal; transform-origin: 0 0; color-scheme: only light; -webkit-text-size-adjust: none; text-size-adjust: none; }
    .textLayer :is(span, br) { position: absolute; color: transparent; white-space: pre; cursor: text; transform-origin: 0 0; user-select: text; }
    /* Keep the actual PDF glyphs visible through selection; the browser's
       substitute text font does not exactly match the embedded PDF font. */
    .textLayer ::selection { color: transparent; -webkit-text-fill-color: transparent; background: rgba(70, 112, 215, .42); }
    .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) { --font-height: 0; --scale-x: 1; --rotate: 0deg; --min-font-size-inv: calc(1 / var(--min-font-size)); font-size: calc(var(--total-scale-factor) * var(--min-font-size) * var(--font-height)); transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv)); }
    .textLayer .markedContent { display: contents; }
    .linkLayer { position: absolute; inset: 0; pointer-events: none; }
    .linkLayer a { position: absolute; display: block; pointer-events: auto; cursor: pointer; }
    .linkLayer a:hover { background: #3a83aa28; }
    .message { padding: 1rem; text-align: center; }
    @media (max-width: 650px) { .thumbnails, #sidebarToggle, .toolbar .title, .toolbar .separator.first { display: none; } .toolbar { justify-content: center; } .scroller { padding: 10px; } }
    @media print { .toolbar, .thumbnails { display: none; } html, body, .workspace, .scroller { height: auto; overflow: visible; padding: 0; background: white; } .sheet { margin: 0; box-shadow: none; break-after: page; } .sheet:last-child { break-after: auto; } .linkLayer { display: none; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="sidebarToggle" type="button" title="Toggle thumbnails" aria-label="Toggle thumbnails">☰</button>
    <span class="title">Rusi Wang - CV</span>
    <span class="separator first"></span>
    <input id="pageNumber" type="number" min="1" value="1" aria-label="Page number"><span id="pageCount">/ 2</span>
    <span class="separator"></span>
    <button id="zoomOut" type="button" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <label class="zoom-control" title="Zoom percentage (50–300%)"><input id="zoomInput" type="number" min="50" max="300" step="1" inputmode="numeric" aria-label="Zoom percentage" value="100"><span>%</span></label>
    <button id="zoomIn" type="button" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
    <button id="fitWidth" type="button" title="Fit width" aria-label="Fit width"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg></button>
    <span class="separator"></span>
    <a href="{{ '/files/Rusi_Wang_CV.pdf' | relative_url }}?v=20261017cv2" download="Rusi_Wang_CV.pdf" title="Download PDF" aria-label="Download PDF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4M4 17v3h16v-3"/></svg></a>
    <button id="print" type="button" title="Print CV" aria-label="Print CV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 15h12v6H6z"/><circle cx="18" cy="12" r=".7" fill="currentColor" stroke="none"/></svg></button>
  </div>
  <div class="workspace">
    <aside class="thumbnails" id="thumbnails" aria-label="Page thumbnails"></aside>
    <main class="scroller" id="scroller"><div id="pages" class="message">Loading CV…</div></main>
  </div>
  <!-- PDF.js is distributed under the Apache License 2.0; see /assets/vendor/pdfjs/LICENSE. -->
  <script type="module">
    import * as pdfjsLib from "{{ '/assets/vendor/pdfjs/pdf.mjs' | relative_url }}";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "{{ '/assets/vendor/pdfjs/pdf.worker.mjs' | relative_url }}";
    const pdfUrl = "{{ '/files/Rusi_Wang_CV.pdf' | relative_url }}?v=20261017cv2";
    const scroller = document.getElementById('scroller');
    const pages = document.getElementById('pages');
    const thumbs = document.getElementById('thumbnails');
    const pageInput = document.getElementById('pageNumber');
    const zoomInput = document.getElementById('zoomInput');
    const zoomSteps = [50, 75, 90, 100, 110, 125, 150, 200, 250, 300];
    let pdf, baseWidth, zoom = 1, fit = true, rendering = 0;

    function selectPage(number) {
      pageInput.value = number;
      thumbs.querySelectorAll('.thumb').forEach((button, index) => button.classList.toggle('active', index + 1 === number));
    }
    function goToPage(number) {
      const page = pages.children[Math.min(Math.max(number, 1), pdf.numPages) - 1];
      if (page) {
        const top = scroller.scrollTop + page.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
        scroller.scrollTo({ top });
        selectPage(Number(page.dataset.page));
      }
    }
    async function render() {
      const ticket = ++rendering;
      const current = Math.min(Math.max(Number(pageInput.value) || 1, 1), pdf.numPages);
      const first = await pdf.getPage(1);
      baseWidth = first.getViewport({ scale: 1 }).width;
      if (fit) {
        const style = getComputedStyle(scroller);
        const padding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
        zoom = Math.min(3, Math.max(0.5, (scroller.clientWidth - padding) / baseWidth));
      }
      zoomInput.value = Math.round(zoom * 100);
      pages.className = '';
      pages.replaceChildren();
      thumbs.replaceChildren();
      for (let number = 1; number <= pdf.numPages; number++) {
        if (ticket !== rendering) return;
        const page = number === 1 ? first : await pdf.getPage(number);
        const viewport = page.getViewport({ scale: zoom });
        const sheet = document.createElement('section');
        sheet.className = 'sheet'; sheet.dataset.page = number;
        sheet.style.width = `${viewport.width}px`; sheet.style.height = `${viewport.height}px`;
        sheet.style.setProperty('--total-scale-factor', zoom);
        const canvas = document.createElement('canvas');
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.ceil(viewport.width * ratio);
        canvas.height = Math.ceil(viewport.height * ratio);
        canvas.style.width = `${viewport.width}px`; canvas.style.height = `${viewport.height}px`;
        sheet.append(canvas);
        const text = document.createElement('div'); text.className = 'textLayer'; sheet.append(text);
        const links = document.createElement('div'); links.className = 'linkLayer'; sheet.append(links);
        pages.append(sheet);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport, transform: [ratio, 0, 0, ratio, 0, 0] }).promise;
        if (ticket !== rendering) return;
        const textLayer = new pdfjsLib.TextLayer({ textContentSource: page.streamTextContent(), container: text, viewport });
        await textLayer.render();
        for (const annotation of await page.getAnnotations({ intent: 'display' })) {
          if (annotation.subtype !== 'Link' || !annotation.url || !/^(https?:|mailto:)/i.test(annotation.url)) continue;
          const [left, bottom, right, top] = annotation.rect;
          const [x1, y1] = viewport.convertToViewportPoint(left, bottom);
          const [x2, y2] = viewport.convertToViewportPoint(right, top);
          const link = document.createElement('a');
          link.href = annotation.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
          link.setAttribute('aria-label', `Open link in new tab: ${annotation.url}`);
          Object.assign(link.style, { left: `${Math.min(x1, x2)}px`, top: `${Math.min(y1, y2)}px`, width: `${Math.abs(x2 - x1)}px`, height: `${Math.abs(y2 - y1)}px` });
          links.append(link);
        }
        const button = document.createElement('button');
        button.className = 'thumb'; button.type = 'button'; button.setAttribute('aria-label', `Go to page ${number}`);
        const small = document.createElement('canvas');
        const smallViewport = page.getViewport({ scale: 0.17 });
        small.width = Math.ceil(smallViewport.width * ratio); small.height = Math.ceil(smallViewport.height * ratio);
        small.style.width = `${smallViewport.width}px`; small.style.height = `${smallViewport.height}px`;
        button.append(small, document.createTextNode(String(number)));
        button.addEventListener('click', () => goToPage(number));
        thumbs.append(button);
        await page.render({ canvasContext: small.getContext('2d'), viewport: smallViewport, transform: [ratio, 0, 0, ratio, 0, 0] }).promise;
      }
      goToPage(current);
    }
    function setZoom(percent) {
      if (!Number.isFinite(percent)) { zoomInput.value = Math.round(zoom * 100); return; }
      fit = false;
      zoom = Math.min(300, Math.max(50, Math.round(percent))) / 100;
      render();
    }
    function stepZoom(direction) {
      const current = Math.round(zoom * 100);
      setZoom(direction > 0
        ? (zoomSteps.find(step => step > current) ?? zoomSteps.at(-1))
        : (zoomSteps.findLast(step => step < current) ?? zoomSteps[0]));
    }
    document.getElementById('zoomOut').addEventListener('click', () => stepZoom(-1));
    document.getElementById('zoomIn').addEventListener('click', () => stepZoom(1));
    let lastWheelZoom = 0;
    window.addEventListener('wheel', event => {
      if (!event.ctrlKey) return;
      event.preventDefault();
      if (!pdf || !event.deltaY) return;
      const now = performance.now();
      if (now - lastWheelZoom < 120) return;
      lastWheelZoom = now;
      stepZoom(event.deltaY < 0 ? 1 : -1);
    }, { passive: false, capture: true });
    zoomInput.addEventListener('change', () => setZoom(zoomInput.valueAsNumber));
    zoomInput.addEventListener('keydown', event => { if (event.key === 'Enter') zoomInput.blur(); });
    document.getElementById('fitWidth').addEventListener('click', () => { fit = true; render(); });
    document.getElementById('sidebarToggle').addEventListener('click', () => { thumbs.hidden = !thumbs.hidden; if (fit) render(); });
    document.getElementById('print').addEventListener('click', () => window.print());
    pageInput.addEventListener('change', () => goToPage(Number(pageInput.value) || 1));
    scroller.addEventListener('scroll', () => {
      const offset = scroller.getBoundingClientRect().top;
      let best = 1, distance = Infinity;
      [...pages.children].forEach((page, index) => {
        const current = Math.abs(page.getBoundingClientRect().top - offset);
        if (current < distance) { distance = current; best = index + 1; }
      });
      if (pages.children.length) selectPage(best);
    });
    let resizeTimer;
    window.addEventListener('resize', () => { if (fit && pdf) { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); } });
    try {
      pdf = await pdfjsLib.getDocument({ url: pdfUrl, isEvalSupported: false }).promise;
      document.getElementById('pageCount').textContent = `/ ${pdf.numPages}`;
      pageInput.max = pdf.numPages;
      await render();
    } catch (error) {
      pages.className = 'message';
      pages.textContent = 'The CV could not be displayed. Please use Download PDF above.';
      console.error('CV reader:', error);
    }
  </script>
</body>
</html>
